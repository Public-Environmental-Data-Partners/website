# Release notes for `git cliff <previous>..<current> --tag vX.Y.Z`.
# https://git-cliff.org/docs/configuration
#
# Groups conventional commits by type. Dependency bumps stay in the notes
# because a patch release can be made of those commits alone.

[changelog]
body = """
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim }}
{% for commit in entry.commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Public-Environmental-Data-Partners/website/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs?", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(deps", group = "Dependencies" },
  { message = "^chore|^ci", group = "Miscellaneous" },
  { message = "^revert", group = "Revert" },
  { message = ".*", group = "Other" },
]
filter_commits = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
